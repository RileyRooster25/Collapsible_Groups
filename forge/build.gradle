plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '7.0.40'
}

minecraft.mavenizer(repositories)
repositories {
    mavenLocal { content { includeGroup 'dev.emi' } }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://libraries.minecraft.net' }
    maven { url = 'https://maven.minecraftforge.net' }
}

base { archivesName = "${mod_id}-forge-${minecraft_version}" }
jar {
    manifest { attributes['MixinConfigs'] = "${mod_id}.mixins.json,${mod_id}.forge.mixins.json" }
}

// Forge 1.21.1 uses official names at runtime; no reobfuscation or refmap is needed.
minecraft {
    mappings('official', minecraft_version)
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) accessTransformers.from(at)
    runs {
        configureEach {
            mods { create(mod_id) { source(sourceSets.main) } }
        }
        create('client') { workingDir = layout.projectDirectory.dir('runs/client') }
        create('server') { workingDir = layout.projectDirectory.dir('runs/server') }
        create('data') {
            workingDir = layout.projectDirectory.dir('runs/data')
            args('--mod', mod_id, '--all', '--output', file('src/generated/resources').absolutePath,
                '--existing', file('src/main/resources').absolutePath)
        }
    }
}
sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.1'
    implementation(minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}"))
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    // JEI Forge API — public API surface (mezz.jei.api.*)
    compileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    // JEI Forge full jar — provides mezz.jei.gui.* / mezz.jei.common.* needed by mixins at compile time
    compileOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
    // Symbols only so the shared EMI compat sources compile; Forge 1.21 does not load EMI.
    compileOnly "dev.emi:emi-xplat-mojmap:${emi_version}"

    // Forge's hack fix
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.compileClasspath
}
test { useJUnitPlatform() }
