plugins { id 'java'; id 'fabric-loom' }
base.archivesName='cg-jei-smoke-1.20.1-fabric'
sourceSets.main.java {srcDir '../src/main/java'}
sourceSets.main.resources.srcDir '../src/main/resources'
dependencies {
 minecraft 'com.mojang:minecraft:1.20.1'
 mappings loom.officialMojangMappings()
 modImplementation 'net.fabricmc:fabric-loader:0.19.5'
 modCompileOnly("mezz.jei:jei-1.20.1-fabric:${rootProject.cgProperties.jei_version}") {transitive=false}
 modCompileOnly files("../../../fabric/build/libs/collapsible_groups-fabric-1.20.1-${rootProject.cgProperties.version}.jar")
}
loom {mixin {useLegacyMixinAp=true;defaultRefmapName='cgsmoke.refmap.json'}}
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
tasks.withType(JavaCompile).configureEach {options.encoding='UTF-8';options.release=17}
