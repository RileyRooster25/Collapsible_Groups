plugins { id 'java'; id 'net.minecraftforge.gradle' }
base.archivesName='cg-jei-smoke-1.21.1-forge'
minecraft.mavenizer(repositories)
repositories { maven { url='https://maven.minecraftforge.net' }; maven { url='https://libraries.minecraft.net' } }
minecraft { mappings('official', '1.21.1') }
sourceSets.main.java.srcDir '../src/main/java'
sourceSets.main.resources.srcDir '../src/main/resources'
dependencies {
 implementation(minecraft.dependency("net.minecraftforge:forge:1.21.1-${rootProject.cgProperties.forge_version}"))
 compileOnly("mezz.jei:jei-1.21.1-forge:${rootProject.cgProperties.jei_version}") {transitive=false}
 compileOnly files("../../../forge/build/libs/collapsible_groups-forge-1.21.1-${rootProject.cgProperties.version}.jar")
}
jar { manifest { attributes['MixinConfigs']='cgsmoke.mixins.json' } }
java.toolchain.languageVersion=JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach {options.encoding='UTF-8';options.release=21}
